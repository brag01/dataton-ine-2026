[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ine-gt"
version = "2.0.0"
description = "Cliente Python para el portal de datos abiertos del INE Guatemala"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
